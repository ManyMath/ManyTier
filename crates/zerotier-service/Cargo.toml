[package]
name = "zerotier-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Native ZeroTier service with platform implementations"

[dependencies]
zerotier-node = { workspace = true, features = ["native"] }
zerotier-crypto = { workspace = true }
zerotier-protocol = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tracing = { workspace = true }
getrandom = { workspace = true }
rand_core = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
lz4_flex = { workspace = true }

# TUN backends are platform specific: Linux goes through /dev/net/tun via
# tun2; macOS talks to the utun kernel control directly with libc. libc is
# also used on every unix for interface enumeration (getifaddrs).
[target.'cfg(target_os = "linux")'.dependencies]
tun2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
