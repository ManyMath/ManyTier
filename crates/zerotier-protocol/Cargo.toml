[package]
name = "zerotier-protocol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "ZeroTier V1 wire format types and protocol definitions"

[features]
default = []
# Placeholder for V2 wire format types (negotiation, new verbs). Empty until V2 is
# scoped; see src/v2.rs for the V1/V2 boundary.
v2 = ["zerotier-crypto/v2"]

[dependencies]
zerotier-crypto = { workspace = true }
zerocopy = { workspace = true }
ed25519-dalek = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
