[package]
name = "zerotier-crypto"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Cryptographic primitives for the ZeroTier protocol"

[features]
default = []
# Placeholder for V2 (P-384/Kyber/ZSSP) crypto primitives. Empty until V2 is scoped; see
# src/v2.rs for the V1/V2 boundary.
v2 = []

[dependencies]
salsa20 = { workspace = true }
poly1305 = { workspace = true }
x25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
rand_core = { workspace = true }
zeroize = { workspace = true }
cipher = { workspace = true }
universal-hash = { workspace = true }
aes = { workspace = true }
ghash = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
